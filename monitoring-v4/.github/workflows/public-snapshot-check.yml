name: public-snapshot-check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Compile source and tests
        run: python -m compileall -q src tests ops/scripts

      - name: Validate the public snapshot boundary
        run: python ops/scripts/validate_public_snapshot.py

      - name: Run the public test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
