apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-retention
  namespace: stream-monitoring-v4
  labels:
    app.kubernetes.io/name: monitoring-v4-backup-retention
    app.kubernetes.io/component: backup-retention
    app.kubernetes.io/part-of: stream-monitoring-v4
spec:
  schedule: "27 19 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: monitoring-v4-backup-retention
            app.kubernetes.io/component: backup-retention
            app.kubernetes.io/part-of: stream-monitoring-v4
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retain
              image: __APP_IMAGE__
              imagePullPolicy: Never
              args:
                - stream_monitoring_v4.commands.backup_retention
                - --backup-dir
                - /backup
                - --independent-backup-dir
                - /independent-backup/stream-v4-postgres
                - --restore-verification-dir
                - /verification
                - --backup-max-age-sec
                - "97200"
                - --primary-retention-days
                - "35"
                - --independent-retention-days
                - "90"
                - --minimum-preserved-sets
                - "2"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: independent-backup
                  mountPath: /independent-backup
                - name: verification
                  mountPath: /verification
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/stream-monitoring-v4/.state/postgres-backups
                type: Directory
            - name: independent-backup
              hostPath:
                path: /var/backups/stream-monitoring-v4
                type: Directory
            - name: verification
              hostPath:
                path: /var/lib/stream-monitoring-v4/.state/restore-verifications
                type: Directory
            - name: tmp
              emptyDir: {}
