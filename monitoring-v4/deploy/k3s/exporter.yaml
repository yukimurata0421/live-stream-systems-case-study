apiVersion: v1
kind: Service
metadata:
  name: monitoring-v4-exporter
  namespace: stream-monitoring-v4
  labels:
    app.kubernetes.io/name: monitoring-v4-exporter
    app.kubernetes.io/part-of: stream-monitoring-v4
spec:
  selector:
    app.kubernetes.io/name: monitoring-v4-exporter
  ports:
    - name: http
      port: 9118
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-v4-exporter
  namespace: stream-monitoring-v4
  labels:
    app.kubernetes.io/name: monitoring-v4-exporter
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: stream-monitoring-v4
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring-v4-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring-v4-exporter
        app.kubernetes.io/component: exporter
        app.kubernetes.io/part-of: stream-monitoring-v4
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: __APP_IMAGE__
          imagePullPolicy: Never
          args:
            - stream_monitoring_v4.commands.exporter
            - --postgres
            - --host
            - 0.0.0.0
            - --port
            - "9118"
            - --build-revision
            - __BUILD_REVISION__
            - --startup-db-timeout-sec
            - "180"
          envFrom:
            - configMapRef:
                name: database-connection
          env:
            - name: PGUSER
              value: v4_exporter_ro
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-roles
                  key: exporter-password
          ports:
            - name: http
              containerPort: 9118
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
