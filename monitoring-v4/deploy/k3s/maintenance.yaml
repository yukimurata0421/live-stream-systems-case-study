apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-retention
  namespace: stream-monitoring-v4
  labels:
    app.kubernetes.io/name: monitoring-v4-retention
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: stream-monitoring-v4
spec:
  schedule: "17 19 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: monitoring-v4-retention
            app.kubernetes.io/component: maintenance
            app.kubernetes.io/part-of: stream-monitoring-v4
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: __APP_IMAGE__
              imagePullPolicy: Never
              args:
                - stream_monitoring_v4.commands.retention
                - --backup-dir
                - /backup
                - --independent-backup-dir
                - /independent-backup/stream-v4-postgres
                - --restore-verification-dir
                - /restore-verifications
                - --backup-max-age-sec
                - "10800"
                - --batch-size
                - "5000"
              envFrom:
                - configMapRef:
                    name: database-connection
              env:
                - name: PGUSER
                  value: v4_maintenance_rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-roles
                      key: maintenance-password
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 192Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: independent-backup
                  mountPath: /independent-backup
                  readOnly: true
                - name: restore-verifications
                  mountPath: /restore-verifications
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/stream-monitoring-v4/.state/postgres-backups
                type: Directory
            - name: independent-backup
              hostPath:
                path: /var/backups/stream-monitoring-v4
                type: Directory
            - name: restore-verifications
              hostPath:
                path: /var/lib/stream-monitoring-v4/.state/restore-verifications
                type: Directory
            - name: tmp
              emptyDir: {}
