groups:
  - name: stream_v4_twitch_sli
    rules:
      - alert: StreamV4TwitchSliMeasurementUnavailable
        expr: up{job="stream_v4_twitch_sli"} == 0 or time() - stream_v4_twitch_sli_generated_unixtime > 180
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Twitch SLI history projection is unavailable or stale
      - alert: StreamV4TwitchSloBreached
        expr: (stream_v4_twitch_sli_conservative_percent{window="7d"} < on(sli,window) stream_v4_twitch_sli_target_percent{window="7d"}) and on(sli,window) (stream_v4_twitch_sli_assessed{window="7d"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Twitch {{ $labels.sli }} seven-day objective missed
          description: API measurement counts successful observation minutes against all expected minutes, including failed attempts and collection gaps. Check API timeout/auth/rate-limit counters and missing minutes separately from media delivery.
