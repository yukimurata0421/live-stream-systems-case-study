rule_files:
- ../rules/twitch_thumbnail.yml
evaluation_interval: 30s
tests:
- name: one missed refresh is tolerated until fourteen minutes
  interval: 30s
  input_series:
  - series: stream_v3_twitch_thumbnail_api_live{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 1+0x30
  - series: stream_v3_twitch_thumbnail_clock_verified{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 1+0x30
  - series: stream_v3_twitch_thumbnail_frame_age_seconds{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+30x30
  - series: stream_v3_twitch_thumbnail_seconds_since_last_valid_observation{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+0x30
  - series: stream_v3_twitch_thumbnail_seconds_since_last_cycle{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 14m
    alertname: TwitchThumbnailStale
    exp_alerts: []
  - eval_time: 14m30s
    alertname: TwitchThumbnailStale
    exp_alerts:
    - exp_labels:
        job: stream_v3_clock_observer
        instance: 127.0.0.1:9108
        target: twitch_thumbnail
        scope: twitch_provider_thumbnail
        alertname: TwitchThumbnailStale
        severity: warning
        component: twitch-thumbnail
      exp_annotations:
        summary: Twitch thumbnail clock is over fourteen minutes old; public video playback
          is unverified
- name: TwitchThumbnailObservationUnavailable
  interval: 30s
  input_series:
  - series: stream_v3_twitch_thumbnail_seconds_since_last_valid_observation{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+30x30
  - series: stream_v3_twitch_thumbnail_api_live{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 1+0x30
  - series: stream_v3_twitch_thumbnail_startup_grace_remaining_seconds{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 5m
    alertname: TwitchThumbnailObservationUnavailable
    exp_alerts: []
  - eval_time: 5m30s
    alertname: TwitchThumbnailObservationUnavailable
    exp_alerts:
    - exp_labels:
        job: stream_v3_clock_observer
        instance: 127.0.0.1:9108
        target: twitch_thumbnail
        scope: twitch_provider_thumbnail
        alertname: TwitchThumbnailObservationUnavailable
        severity: warning
        component: twitch-thumbnail
      exp_annotations:
        summary: Twitch API reports LIVE but thumbnail clock observation is unavailable
- name: TwitchThumbnailWorkerUnavailable
  interval: 30s
  input_series:
  - series: stream_v3_twitch_thumbnail_seconds_since_last_cycle{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+30x30
  - series: stream_v3_twitch_thumbnail_api_live{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 1+0x30
  alert_rule_test:
  - eval_time: 5m
    alertname: TwitchThumbnailWorkerUnavailable
    exp_alerts: []
  - eval_time: 5m30s
    alertname: TwitchThumbnailWorkerUnavailable
    exp_alerts:
    - exp_labels:
        job: stream_v3_clock_observer
        instance: 127.0.0.1:9108
        target: twitch_thumbnail
        scope: twitch_provider_thumbnail
        alertname: TwitchThumbnailWorkerUnavailable
        severity: warning
        component: twitch-thumbnail
      exp_annotations:
        summary: Twitch thumbnail publication is over five minutes old or its metric is absent for ten minutes
- name: API offline or unknown does not become thumbnail failure
  interval: 30s
  input_series:
  - series: stream_v3_twitch_thumbnail_api_live{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+0x30
  - series: stream_v3_twitch_thumbnail_seconds_since_last_valid_observation{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 1000+30x30
  - series: stream_v3_twitch_thumbnail_startup_grace_remaining_seconds{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 10m
    alertname: TwitchThumbnailObservationUnavailable
    exp_alerts: []
- name: new stream gets at most twelve minutes to replace the old thumbnail
  interval: 30s
  input_series:
  - series: stream_v3_twitch_thumbnail_seconds_since_last_valid_observation{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+30x30
  - series: stream_v3_twitch_thumbnail_api_live{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 1+0x30
  - series: stream_v3_twitch_thumbnail_startup_grace_remaining_seconds{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 720-30x24 0+0x6
  alert_rule_test:
  - eval_time: 11m30s
    alertname: TwitchThumbnailObservationUnavailable
    exp_alerts: []
  - eval_time: 12m
    alertname: TwitchThumbnailObservationUnavailable
    exp_alerts:
    - exp_labels:
        job: stream_v3_clock_observer
        instance: 127.0.0.1:9108
        target: twitch_thumbnail
        scope: twitch_provider_thumbnail
        severity: warning
        component: twitch-thumbnail
      exp_annotations:
        summary: Twitch API reports LIVE but thumbnail clock observation is unavailable
- name: total disappearance of the metric cannot silence worker warnings
  interval: 30s
  input_series:
  - series: stream_v3_twitch_thumbnail_seconds_since_last_cycle{job="stream_v3_clock_observer",instance="127.0.0.1:9108",target="twitch_thumbnail",scope="twitch_provider_thumbnail"}
    values: 0+0x4 stale _x24
  alert_rule_test:
  - eval_time: 11m30s
    alertname: TwitchThumbnailWorkerUnavailable
    exp_alerts: []
  - eval_time: 12m
    alertname: TwitchThumbnailWorkerUnavailable
    exp_alerts:
    - exp_labels:
        job: stream_v3_clock_observer
        instance: 127.0.0.1:9108
        target: twitch_thumbnail
        scope: twitch_provider_thumbnail
        severity: warning
        component: twitch-thumbnail
      exp_annotations:
        summary: Twitch thumbnail publication is over five minutes old or its metric is absent for ten minutes
