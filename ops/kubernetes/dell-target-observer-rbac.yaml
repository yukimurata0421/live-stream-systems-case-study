apiVersion: v1
kind: ServiceAccount
metadata:
  name: cra-phase4-target-observer
  namespace: stream-v3
  labels:
    app.kubernetes.io/name: cra-phase4-target-observer
    app.kubernetes.io/component: read-only-shadow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cra-phase4-target-observer
  namespace: stream-v3
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cra-phase4-target-observer
  namespace: stream-v3
subjects:
  - kind: ServiceAccount
    name: cra-phase4-target-observer
    namespace: stream-v3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cra-phase4-target-observer
