[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-recovery-control"
version = "2.0.0"
description = "Central Restart Authority: local FFmpeg stall decisions, signed policy, and audit verification"
requires-python = ">=3.11"
dependencies = ["cryptography>=46,<47"]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
  # Real Executor integration tests use the companion Stream source in ../src.
  "jsonschema>=4.19,<5",
  "rfc8785>=0.1.4,<0.2",
]

[project.scripts]
cra-agent = "cra.agent:main"
cra-central = "cra.central.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cra", "cra.*"]

[tool.pytest.ini_options]
pythonpath = ["src", "../src", "."]
testpaths = ["tests"]
addopts = "--strict-markers -ra"

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = ["artifacts", ".runtime", ".deploy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cra"]
mypy_path = "src"
