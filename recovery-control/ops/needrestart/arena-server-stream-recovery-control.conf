$nrconf{override_rc}{qr(^stream-v3-arena-monitor\.service$)} = 0;
$nrconf{override_rc}{qr(^stream-v3-persistent-anchor-observer\.service$)} = 0;
$nrconf{override_rc}{qr(^cra-authority-shadow\.service$)} = 0;
$nrconf{override_rc}{qr(^maintenance-coordinator-shadow\.service$)} = 0;
