[project]
name = "stream-v3"
version = "3.5.0"
description = "Reliability engineering case study for a self-built 24/7 YouTube Live pipeline"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mutagen",
  "Pillow",
  "PyYAML",
  "requests",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
