apiVersion: v1
kind: Service
metadata:
  name: stream-v3-fallback-monitor
  namespace: stream-v3
spec:
  # Keep best-effort datagrams directed to the Pod during readiness transitions.
  publishNotReadyAddresses: true
  selector:
    app: stream-v3-oci-monitor-probe
  ports:
    - name: fallback
      port: 8767
      targetPort: 8767
      protocol: UDP
