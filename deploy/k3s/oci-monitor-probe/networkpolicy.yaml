apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stream-v3-oci-monitor-probe
  namespace: stream-v3
spec:
  podSelector:
    matchLabels:
      app: stream-v3-oci-monitor-probe
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stream-v3-youtube-backup
      ports:
        - protocol: UDP
          port: 8767
    # Existing HTTP snapshots, SSH loopback pull and kubelet probes.
    # hostPort remains bound only to 127.0.0.1.
    - ports:
        - protocol: TCP
          port: 8766
  egress:
    - to:
        - ipBlock:
            cidr: REPLACE_OCI_PRIVATE_RELAY_IP/32
      ports:
        - protocol: TCP
          port: 1936
