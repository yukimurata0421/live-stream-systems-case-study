apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../v3-runtime/state-pvc.yaml
  - ../v3-runtime/music-pvc.yaml
  - ../v3-runtime/deployment.yaml
  - ../local/recovery-rbac.yaml
  - ../local/recovery-token-secret.yaml
patches:
  - path: patch-configmap-streaming.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: stream-v3-runtime
      namespace: stream-v3
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: stream-v3-recovery
      - op: add
        path: /spec/template/spec/schedulingGates
        value:
          - name: stream-v3.io/gpu-ready
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STREAM_V3_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STREAM_V3_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          exec:
            command:
              - python3
              - /app/src/stream_core/runtime_readiness.py
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 2
          successThreshold: 1
      - op: replace
        path: /spec/template/spec/volumes/2
        value:
          name: music
          hostPath:
            path: /home/yuki/projects/stream_v3/ncs_music
            type: Directory
      - op: remove
        path: /spec/template/spec/containers/2
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: fast-recovery-loop
          image: stream-v3:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc"]
          args:
            - >-
              PYTHONPATH=/app/src python3 -m stream_v3.control_loop --mode streaming
          envFrom:
            - configMapRef:
                name: stream-v3-shadow-env
            - secretRef:
                name: stream-v3-secrets
                optional: true
          env:
            - name: STREAM_V3_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STREAM_V3_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
