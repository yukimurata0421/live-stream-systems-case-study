name: public-snapshot-check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install public snapshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Restore executable bits
        run: |
          chmod +x bin/stream bin/stream-new bin/stream-prod bin/organize-time || true
          chmod +x ops/scripts/*.py ops/scripts/*.sh || true
          chmod +x src/stream_v3/runtime_entrypoint.sh || true

      - name: Compile check
        run: |
          python -m compileall -q src tests ops/scripts

      - name: Validate k3s manifests
        run: |
          python ops/scripts/validate_k3s_manifests.py

      - name: Shadow acceptance
        run: |
          python ops/scripts/v3_shadow_acceptance.py

      - name: Public test suite
        run: python -m pytest -q

  recovery-control-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: recovery-control

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install recovery-control test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[test]'

      - name: Build pinned SQLite runtime
        run: tools/sqlite_runtime/build.sh

      - name: Compile recovery-control
        run: .venv/bin/python -m compileall -q src tests tools

      - name: Validate recovery-control public boundary
        run: python tools/validate_public_snapshot.py

      - name: Run recovery-control public test suite
        run: tools/sqlite_runtime/run-fixed.sh .venv/bin/python tools/run_public_test_suite.py
